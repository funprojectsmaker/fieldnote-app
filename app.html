<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard · Fieldnote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="demo-bar">Portfolio demo by Shreyas · Your account and jobs are saved in a real database</div>

<header class="topbar">
  <div class="in">
    <a class="logo" href="/">
      <svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="#2350D8"/><path d="M9 8h12M9 15h8M9 22h5" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="22" cy="21" r="3.5" fill="#FF6B4A"/></svg>
      Fieldnote
    </a>
    <div class="who">
      <span class="av" id="avatar">··</span>
      <span class="meta"><strong id="u-name">Loading…</strong><small id="u-email"></small></span>
      <button class="btn sec small" id="logout" type="button">Log out</button>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1 id="greeting">Your jobs</h1>
      <p id="company-line">Everything scheduled for your crew.</p>
    </div>
  </div>

  <div class="kpis" aria-live="polite">
    <div class="kpi"><span>Scheduled</span><b id="k-open">0</b></div>
    <div class="kpi"><span>Completed</span><b id="k-done">0</b></div>
    <div class="kpi"><span>Booked value</span><b id="k-total">$0</b></div>
    <div class="kpi"><span>Completed value</span><b id="k-paid">$0</b></div>
  </div>

  <div class="grid2">
    <section class="panel" aria-labelledby="add-h">
      <h2 id="add-h">Add a job</h2>
      <form class="form" id="add" novalidate>
        <div class="alert" role="alert" hidden></div>
        <div class="field"><label for="title">Job</label><input id="title" name="title" placeholder="e.g. Replace kitchen faucet" required><span class="err"></span></div>
        <div class="field"><label for="customer">Customer</label><input id="customer" name="customer" placeholder="Customer name"><span class="err"></span></div>
        <div class="field"><label for="address">Address</label><input id="address" name="address" placeholder="Street address"><span class="err"></span></div>
        <div class="two">
          <div class="field"><label for="scheduled_for">When</label><input id="scheduled_for" name="scheduled_for" type="datetime-local"><span class="err"></span></div>
          <div class="field"><label for="price">Price ($)</label><input id="price" name="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"><span class="err"></span></div>
        </div>
        <button class="btn" type="submit">Add job</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-h">
      <h2 id="list-h">Jobs</h2>
      <div class="list" id="list"><p class="empty">Loading your jobs…</p></div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import { api, showErrors, busy } from '/js/api.js';

const $ = (id) => document.getElementById(id);
const money = (cents) => (cents / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: cents % 100 ? 2 : 0 });
const when = (s) => s ? new Date(s).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'Not scheduled';
let jobs = [];
let toastTimer;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2400);
}

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach((k) => k != null && n.append(k));
  return n;
}

function render() {
  const open = jobs.filter((j) => j.status === 'scheduled');
  const done = jobs.filter((j) => j.status === 'done');
  $('k-open').textContent = open.length;
  $('k-done').textContent = done.length;
  $('k-total').textContent = money(jobs.reduce((s, j) => s + j.price_cents, 0));
  $('k-paid').textContent = money(done.reduce((s, j) => s + j.price_cents, 0));

  const list = $('list');
  list.replaceChildren();
  if (!jobs.length) {
    list.append(el('p', { className: 'empty', textContent: 'No jobs yet. Add your first job with the form.' }));
    return;
  }
  for (const j of jobs) {
    const isDone = j.status === 'done';
    const check = el('button', { className: 'check', type: 'button', title: isDone ? 'Mark as scheduled' : 'Mark as done' });
    check.setAttribute('aria-label', (isDone ? 'Mark as scheduled: ' : 'Mark as done: ') + j.title);
    check.addEventListener('click', () => toggle(j));

    const del = el('button', { className: 'btn danger small', type: 'button', textContent: 'Delete' });
    del.setAttribute('aria-label', 'Delete ' + j.title);
    del.addEventListener('click', () => remove(j, del));

    // textContent everywhere: user input is never inserted as HTML (prevents XSS)
    list.append(el('div', { className: 'job' + (isDone ? ' done' : '') },
      check,
      el('div', { style: 'min-width:0' },
        el('div', { className: 't', textContent: j.title }),
        el('div', { className: 'm' },
          el('span', { textContent: when(j.scheduled_for) }),
          j.customer ? el('span', { textContent: j.customer }) : null,
          j.address ? el('span', { textContent: j.address }) : null)),
      el('div', { className: 'r' },
        el('span', { className: 'status', textContent: isDone ? 'Done' : 'Scheduled' }),
        el('span', { className: 'price', textContent: money(j.price_cents) }),
        del)));
  }
}

async function load() {
  try {
    const [{ user }, data] = await Promise.all([api('/auth/me'), api('/jobs')]);
    $('u-name').textContent = user.name;
    $('u-email').textContent = user.email;
    $('avatar').textContent = user.name.split(/\s+/).map((p) => p[0]).join('').slice(0, 2).toUpperCase();
    $('greeting').textContent = `Hi ${user.name.split(' ')[0]}, here are your jobs`;
    if (user.company) $('company-line').textContent = `Everything scheduled for ${user.company}.`;
    jobs = data.jobs;
    render();
  } catch (err) {
    if (err.status === 401) location.href = '/login?next=/app';
    else $('list').replaceChildren(el('p', { className: 'empty', textContent: err.message }));
  }
}

async function toggle(job) {
  const status = job.status === 'done' ? 'scheduled' : 'done';
  try {
    const { job: updated } = await api('/jobs/' + job.id, { method: 'PATCH', body: { status } });
    jobs = jobs.map((j) => (j.id === job.id ? updated : j));
    render();
    toast(status === 'done' ? 'Marked as done' : 'Moved back to scheduled');
  } catch (err) { handle(err); }
}

async function remove(job, btn) {
  // Two-step delete instead of a confirm() popup
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1'; btn.textContent = 'Confirm';
    setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = 'Delete'; } }, 3000);
    return;
  }
  try {
    await api('/jobs/' + job.id, { method: 'DELETE' });
    jobs = jobs.filter((j) => j.id !== job.id);
    render();
    toast('Job deleted');
  } catch (err) { handle(err); }
}

function handle(err) {
  if (err.status === 401) location.href = '/login?next=/app';
  else toast(err.message);
}

const form = $('add');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(form));
  if (!body.title.trim()) return showErrors(form, '', { title: 'Describe the job.' });
  const btn = form.querySelector('[type=submit]');
  busy(btn, true, 'Adding…');
  try {
    const { job } = await api('/jobs', { method: 'POST', body });
    jobs.push(job);
    jobs.sort((a, b) => (a.status === 'done') - (b.status === 'done') || String(a.scheduled_for || '9').localeCompare(String(b.scheduled_for || '9')));
    render();
    form.reset();
    showErrors(form, '', {});
    toast('Job added');
  } catch (err) {
    if (err.status === 401) return handle(err);
    showErrors(form, err.message, err.fields);
  } finally { busy(btn, false); }
});

$('logout').addEventListener('click', async () => {
  try { await api('/auth/logout', { method: 'POST' }); } finally { location.href = '/login'; }
});

load();
</script>
</body>
</html>
